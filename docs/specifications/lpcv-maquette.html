<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPCV — Les Professionnels Chez Vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS — LPCV Design Language (Volume 3) ===== */
:root{
  --white-cold:#F8FAFC;
  --white:#FFFFFF;
  --black:#111827;
  --orange:#F97316;
  --orange-dark:#EA580C;
  --green:#16A34A;
  --green-light:#DCFCE7;
  --blue:#2563EB;
  --blue-light:#DBEAFE;
  --gray:#9CA3AF;
  --gray-light:#E5E7EB;
  --gray-bg:#F1F5F9;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px; --sp-20:80px;

  --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-pill:999px;
  --shadow-card: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px -12px rgba(17,24,39,.12);
  --shadow-card-hover: 0 4px 8px rgba(17,24,39,.06), 0 16px 32px -12px rgba(17,24,39,.18);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:'Inter',sans-serif; background:var(--white-cold); color:var(--black);
  font-size:15px; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-0.02em;}
h1{font-size:clamp(32px,5vw,52px); line-height:1.05;}
h2{font-size:clamp(22px,3vw,28px); font-weight:800;}
h3{font-size:18px; font-weight:700;}
p{margin:0;}
a{text-decoration:none; color:inherit;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

.container{max-width:1200px; margin:0 auto; padding:0 var(--sp-6);}
.view{display:none;}
.view.active{display:block; animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .view.active{animation:none;} html{scroll-behavior:auto;} }

/* ===== NAV ===== */
.nav{position:sticky; top:0; z-index:50; background:rgba(248,250,252,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--gray-light);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 0;}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px;}
.logo-mark{width:34px; height:34px; border-radius:10px; background:var(--black); color:var(--white); display:flex; align-items:center; justify-content:center; font-size:16px;}
.nav-links{display:flex; gap:28px; align-items:center;}
.nav-link{font-size:14px; font-weight:600; color:var(--black); opacity:.65; padding:8px 0; border-bottom:2px solid transparent;}
.nav-link.active, .nav-link:hover{opacity:1;}
.nav-cta{display:flex; gap:10px; align-items:center;}
.nav-toggle{display:none;}

@media (max-width:900px){
  .nav-links{display:none;}
  .nav-toggle{display:flex;}
}

/* ===== BUTTONS ===== */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:var(--radius-pill); font-weight:700; font-size:14px; border:none; transition:transform .12s ease, box-shadow .12s ease, background .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--orange); color:var(--white);}
.btn-primary:hover{background:var(--orange-dark);}
.btn-dark{background:var(--black); color:var(--white);}
.btn-dark:hover{background:#000;}
.btn-outline{background:transparent; color:var(--black); border:1.5px solid var(--gray-light);}
.btn-outline:hover{border-color:var(--black);}
.btn-green{background:var(--green); color:var(--white);}
.btn-sm{padding:8px 16px; font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--black); opacity:.6; padding:8px 12px;}
.btn-ghost:hover{opacity:1;}

/* ===== CARDS / BADGES ===== */
.card{background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border:1px solid var(--gray-light);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:var(--radius-pill);}
.badge-verified{background:var(--green-light); color:var(--green);}
.badge-pending{background:#FFF7ED; color:var(--orange-dark);}
.badge-info{background:var(--blue-light); color:var(--blue);}
.badge-muted{background:var(--gray-bg); color:#64748B;}

.input{width:100%; padding:12px 14px; border:1.5px solid var(--gray-light); border-radius:var(--radius-md); font-size:14px; font-family:inherit; background:var(--white); transition:border-color .15s;}
.input:focus{border-color:var(--black);}
.label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#374151;}
.field{margin-bottom:16px;}

/* ===== SECTION HELPERS ===== */
.section{padding:var(--sp-16) 0;}
.eyebrow{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--orange);}
.grid-12{display:grid; grid-template-columns:repeat(12,1fr); gap:24px;}
@media (max-width:1024px){.grid-12{grid-template-columns:repeat(6,1fr);}}
@media (max-width:640px){.grid-12{grid-template-columns:repeat(2,1fr);}}

/* Scrollbar-less horizontal scroller for mobile category rows */
.scroller{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;}
.scroller::-webkit-scrollbar{display:none;}

footer{background:var(--black); color:var(--white); padding:var(--sp-16) 0 var(--sp-8);}
footer .foot-cols{display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
footer a{opacity:.7; font-size:14px;}
footer a:hover{opacity:1;}
@media (max-width:640px){footer .foot-cols{grid-template-columns:1fr 1fr;}}

/* Toast */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--black); color:var(--white); padding:12px 20px; border-radius:var(--radius-pill); font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200; display:flex; align-items:center; gap:8px;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app"></div>

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function stars(note){
  const full = Math.round(note);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

function proById(id){ return PROS.find(p=>p.id===id); }

function avatarHTML(p, size=48){

}

/* ===================== NAVIGATION ===================== */

  STATE.currentView = view;
  Object.assign(STATE, opts);
  render();
  window.scrollTo(0,0);
}

function proCardHTML(p){

function getFilteredPros(){
  let list = [...PROS];
  if(STATE.searchMetier) list = list.filter(p=>p.metier===STATE.searchMetier);
  if(STATE.searchQuartier) list = list.filter(p=>p.quartier===STATE.searchQuartier);
  if(STATE.filters.verifieUniquement) list = list.filter(p=>p.verifie);
  if(STATE.filters.tri==='note') list.sort((a,b)=>b.note-a.note);
  return list;
}

}

function avancerSuivi(){
  STATE.suiviStatut = Math.min(STATE.suiviStatut+1, STATUTS.length-1);
  toast('Statut mis à jour : '+STATUTS[STATE.suiviStatut]);
  render();
}

/* ===================== VUE : AVIS POST-INTERVENTION ===================== */
function renderAvisForm(){
  const p = proById(STATE.currentProId);
  return `
  <section class="section" style="max-width:480px;margin:0 auto;padding-top:56px;">
    <div class="container" style="padding:0;">
      <div class="card" style="padding:32px;text-align:center;">
        <div style="font-size:34px;">🎉</div>
        <h2 style="margin-top:12px;">Intervention terminée</h2>
        <p style="color:#6B7280;font-size:14px;margin-top:6px;">Comment évaluez-vous ${p.nom} ?</p>
        <div id="star-picker" style="font-size:34px;margin:20px 0;color:var(--gray-light);letter-spacing:6px;">★★★★★</div>
        <textarea class="input" rows="3" placeholder="Partagez votre expérience (facultatif)"></textarea>
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="soumettreAvis()">Publier mon avis</button>
        <button class="btn btn-ghost btn-block" style="margin-top:6px;" onclick="navigate('dashboard')">Passer cette étape</button>
      </div>
    </div>
  </section>`;
}
function soumettreAvis(){ toast('Merci pour votre avis ✓'); navigate('dashboard'); }

/* ===================== VUE : TABLEAU DE BORD CLIENT ===================== */
let dashTab = 'demandes';
const DEMANDES_HISTORIQUE = [
  {id:'042', pro:proById(1), statut:'Terminée', date:'19 juil. 2026', montant:'12 500 FCFA'},
  {id:'041', pro:proById(3), statut:'Terminée', date:'12 juil. 2026', montant:'9 000 FCFA'},
  {id:'039', pro:proById(4), statut:'Annulée', date:'02 juil. 2026', montant:'—'},
];
function renderDashboard(){
  return `
  <section class="section" style="padding-top:32px;">
    <div class="container">
      <h2>Mon espace</h2>
      <div style="display:flex;gap:8px;margin:22px 0;border-bottom:1px solid var(--gray-light);">
        ${[['demandes','Mes demandes'],['avis','Mes avis'],['paiements','Historique paiements']].map(([id,label])=>`
          <button class="btn btn-ghost" style="border-radius:0;border-bottom:2px solid ${dashTab===id?'var(--orange)':'transparent'};color:${dashTab===id?'var(--black)':'#6B7280'};opacity:1;" onclick="dashTab='${id}'; render();">${label}</button>`).join('')}
      </div>

      ${dashTab==='demandes'? `
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${DEMANDES_HISTORIQUE.map(d=>`
            <div class="card" style="padding:18px;display:flex;align-items:center;gap:16px;">
              ${avatarHTML(d.pro,44)}
              <div style="flex:1;">
                <div style="font-weight:700;font-size:14px;">${d.pro.nom} <span style="font-weight:400;color:#9CA3AF;">#LPCV-${d.id}</span></div>
                <div style="font-size:13px;color:#6B7280;">${d.pro.label} · ${d.date}</div>
              </div>
              <span class="badge ${d.statut==='Terminée'?'badge-verified':d.statut==='Annulée'?'badge-muted':'badge-pending'}">${d.statut}</span>
              <strong style="font-size:14px;width:100px;text-align:right;">${d.montant}</strong>
              <button class="btn btn-outline btn-sm" onclick="navigate('suivi',{currentProId:${d.pro.id}})">Détails</button>
            </div>`).join('')}
        </div>
      ` : dashTab==='avis'? `
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${AVIS_PROFIL.map(a=>`
          <div class="card" style="padding:16px;">
            <div style="display:flex;justify-content:space-between;"><strong style="font-size:14px;">Kouassi Yao Bertin</strong><span style="font-size:12px;color:#9CA3AF;">${a.date}</span></div>
            <div style="color:#F59E0B;margin:4px 0;">${stars(a.note)}</div>
            <p style="font-size:14px;color:#4B5563;">${a.texte}</p>
          </div>`).join('')}
        </div>
      ` : `
        <div class="card" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:14px;">
            <thead><tr style="background:var(--gray-bg);text-align:left;">
              <th style="padding:14px 18px;">Date</th><th style="padding:14px 18px;">Professionnel</th><th style="padding:14px 18px;">Moyen</th><th style="padding:14px 18px;">Montant</th>
            </tr></thead>
            <tbody>
              ${DEMANDES_HISTORIQUE.filter(d=>d.montant!=='—').map(d=>`
                <tr style="border-top:1px solid var(--gray-light);">
                  <td style="padding:14px 18px;">${d.date}</td>
                  <td style="padding:14px 18px;">${d.pro.nom}</td>
                  <td style="padding:14px 18px;">Wave</td>
                  <td style="padding:14px 18px;font-weight:700;">${d.montant}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  </section>`;
}

/* ===================== VUE : MESSAGERIE ===================== */
function renderMessagerie(){
  const p = proById(STATE.currentProId);
  return `
  <section class="section" style="max-width:560px;margin:0 auto;padding-top:32px;">
    <div class="container" style="padding:0;">
      <div class="card" style="display:flex;flex-direction:column;height:70vh;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;gap:12px;">
          ${avatarHTML(p,38)}
          <div><div style="font-weight:700;font-size:14px;">${p.nom}</div><div style="font-size:12px;color:var(--green);">En ligne</div></div>
          <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="navigate('suivi')">Voir la demande</button>
        </div>
        <div id="msg-list" style="flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;">
          ${STATE.messages.map(m=>`
            <div style="display:flex;justify-content:${m.de==='client'?'flex-end':'flex-start'};">
              <div style="max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;background:${m.de==='client'?'var(--orange)':'var(--gray-bg)'};color:${m.de==='client'?'#fff':'#111827'};">
                ${m.texte}
                <div style="font-size:10px;opacity:.7;margin-top:4px;">${m.heure}</div>
              </div>
            </div>`).join('')}
        </div>
        <div style="padding:14px;border-top:1px solid var(--gray-light);display:flex;gap:8px;">
          <input id="msg-input" class="input" placeholder="Écrivez un message…" onkeydown="if(event.key==='Enter')envoyerMessage()">
          <button class="btn btn-primary" onclick="envoyerMessage()">Envoyer</button>
        </div>
      </div>
    </div>
  </section>`;
}
function envoyerMessage(){
  const input = document.getElementById('msg-input');
  if(!input.value.trim()) return;
  STATE.messages.push({de:'client', texte:input.value.trim(), heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  render();
  setTimeout(()=>{ const l=document.getElementById('msg-list'); if(l) l.scrollTop=l.scrollHeight; },20);
}

/* ===================== ROUTEUR PRINCIPAL ===================== */
const VIEW_RENDERERS = {
  accueil: renderAccueil,
  auth: renderAuth,
  recherche: renderRecherche,
  profil: renderProfil,
  demande: renderDemande,
  suivi: renderSuivi,
  avis: renderAvisForm,
  dashboard: renderDashboard,
  messagerie: renderMessagerie,
};

function render(){
  const renderer = VIEW_RENDERERS[STATE.currentView] || renderAccueil;
  document.getElementById('app').innerHTML = `
    ${renderNav()}
    <main>${renderer()}</main>
    ${renderFooter()}
  `;
}

render();
</script>
