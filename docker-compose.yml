services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpcv
      POSTGRES_PASSWORD: lpcv
      POSTGRES_DB: lpcv_dev
    ports:
      # 5433 côté host : le port 5432 est déjà pris par une installation
      # PostgreSQL native sur cette machine (service Windows), qui interceptait
      # silencieusement toutes les connexions destinées au conteneur.
      - "5433:5432"
    volumes:
      - lpcv_postgres_data:/var/lib/postgresql/data

volumes:
  lpcv_postgres_data:
